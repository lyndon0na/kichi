[package]
name = "kichi-core"
description = "PikPak 非官方 API 的纯 Rust 封装（无 Qt 依赖）"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
chrono = "0.4"
md-5 = "0.11"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "json",
    "rustls",
    "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
