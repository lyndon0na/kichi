[package]
name = "kichi"
description = "PikPak 第三方 Linux 客户端（KDE Plasma）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ashpd = "0.11"
base64 = "0.22"
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
keyring = "4"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
kichi-core = { path = "../kichi-core" }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
resvg = { version = "0.49.0", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"
