[package]
name = "kichi"
description = "PikPak 第三方 Linux 客户端（KDE Plasma）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ashpd = "0.11"
base64 = "0.22"
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
keyring = "4"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
kichi-core = { path = "../kichi-core" }
libc = "0.2"
libmpv2 = { version = "7", default-features = false }
libmpv2-sys = "4"
notify-rust = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
resvg = { version = "0.49.0", default-features = false }
wl-proxy = { version = "0.1.5", default-features = false, features = [
    "protocol-color_management_v1",
    "protocol-color_representation_v1",
    "protocol-commit_timing_v1",
    "protocol-content_type_v1",
    "protocol-drm",
    "protocol-fractional_scale_v1",
    "protocol-linux_dmabuf_v1",
    "protocol-presentation_time",
    "protocol-tearing_control_v1",
    "protocol-viewporter",
    "protocol-xdg_shell",
    "protocol-xdg_session_management_v1",
] }

[build-dependencies]
cxx-qt-build = "0.10"
