[workspace]
resolver = "2"
members = ["crates/kichi-core", "crates/kichi-gui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lyndon0na/kichi"

[workspace.dependencies]
kichi-core = { path = "crates/kichi-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "http2", "native-tls", "stream"] }
futures-util = "0.3"
md-5 = "0.11"
uuid = { version = "1", features = ["v4"] }
dirs = "7"
thiserror = "2"
tracing = "0.1"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
